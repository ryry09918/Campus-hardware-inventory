{% extends "base.html" %}
{% block title %}Register Account - Campus Hardware{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 3rem auto;">
    <h3 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h3>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" value="{{ username if username else '' }}" required autofocus>
            <small style="color: gray;">Letters, numbers, and underscores only (min 3 chars).</small>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ email if email else '' }}" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
            <small style="color: gray;">Min 8 chars, 1 uppercase, 1 digit, 1 special char (@#$%^&*).</small>
        </div>
        <button type="submit" style="width: 100%; padding: 0.75rem;">Register</button>
    </form>
    <div style="margin-top: 1.25rem; text-align: center; font-size: 0.9rem;">
        <a href="{{ url_for('login') }}" style="color: #2b6cb0;">Back to Login</a>
    </div>
</div>
{% endblock %}
