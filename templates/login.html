{% extends "base.html" %}
{% block title %}Login - Campus Hardware{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h3>Sign In</h3>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required value="{{ locked_username if locked_username else '' }}">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" style="width: 100%;">Login</button>
    </form>
    <div style="margin-top: 1rem; display: flex; justify-content: space-between; font-size: 0.85rem;">
        <a href="{{ url_for('register') }}">Create Account</a>
        <a href="{{ url_for('reset_request') }}">Reset Password</a>
    </div>
</div>
{% endblock %}
